const FAVORITES = 'favorites';
const ALL = 'all';
const HIGHEST = 'highest';
// the order in which the Tab key steps through the tabs
const TAB_ORDER = [FAVORITES, ALL, HIGHEST];
// the name that the list on the left shows for each tab
const TAB_LABELS = { [FAVORITES]: 'Favorites', [ALL]: 'All', [HIGHEST]: 'Highest rated by builders' };
const BLANK_PAGE = 'about:blank';
const EMPTY_TAB_NOTICE = 'No worlds in this list.';
// the number of seconds for which the i key gives the world the keyboard focus
const INTERACT_SECONDS = 3;
// the number of seconds after the iframe starts to load a world during which the i key is unavailable
const INTERACT_DELAY_SECONDS = 5;
const INTERACT_NOTICE = 'Keys go to the world for ' + INTERACT_SECONDS + ' seconds: right arrow hurries to the next portal.';
// the names of the favorite worlds
let favorites;
// The page's URL carries the favorites after the # sign, as in #fav=24,61, so that a copied URL shares them.
// Each number is a world's position in TABS.all, counted from 1. This text after the # sign is a favorites hash.
const HASH_PARAMETER = 'fav';
// the default favorites, which the user supplied as a URL on 2026-11-11
const DEFAULT_HASH = '#fav=9,23,52,85,101,102,130,162,165,169,208,220,221,258,260,277,291,308,314,320,363,427,430,447';
// the browser storage key that holds the favorites hash of the last change
const STORAGE_KEY = 'thumb-review-favorites';
// The favorites come from the first of these that holds a favorites hash: the URL, the browser storage, the default.
favorites = parseFavorites(location.hash) || parseFavorites(localStorage.getItem(STORAGE_KEY) || '') || parseFavorites(DEFAULT_HASH);
save();

// the favorites that a favorites hash carries, or null when the text carries none
function parseFavorites(hash) {
  const parameters = new URLSearchParams(hash.slice(1));
  if (!parameters.has(HASH_PARAMETER)) return null;
  const result = new Set();
  for (const text of parameters.get(HASH_PARAMETER).split(',')) {
    if (text === '') continue;
    const position = Number(text);
    if (!Number.isInteger(position) || position < 1 || position > TABS.all.length) {
      const message = 'The favorites list "' + hash + '" names world number "' + text + '"; a world number is a whole number from 1 to ' + TABS.all.length + '.';
      alert(message);
      throw new Error(message);
    }
    result.add(TABS.all[position - 1]);
  }
  return result;
}

function favoritesHash() {
  const positions = [];
  TABS.all.forEach((name, index) => { if (favorites.has(name)) positions.push(index + 1); });
  return '#' + HASH_PARAMETER + '=' + positions.join(',');
}

// a URL that the user pastes into this tab replaces the favorites
window.addEventListener('hashchange', () => {
  const pastedFavorites = parseFavorites(location.hash);
  if (!pastedFavorites) return;
  favorites = pastedFavorites;
  forgetLastChanges();
  save();
  render();
});

const positions = {};

// the worlds of the selected tab

let current = 0;

let showThumb = false;
// true: the iframe keeps the keyboard focus, so the world's page receives the keys

let addedWorlds = [];

let interactAvailable = false;

// writes the favorites to the URL and to the browser storage
function save() {
  const hash = favoritesHash();
  localStorage.setItem(STORAGE_KEY, hash);
  if (location.hash !== hash) history.replaceState(null, '', hash);
}

function setText(id, text) {
  const element = document.getElementById(id);
  if (element.textContent !== text) element.textContent = text;
}

function setLinks(id, names) {
  const container = document.getElementById(id);
  const key = names.join(' ');
  if (container.dataset.key === key) return;
  container.dataset.key = key;
  container.textContent = '';
  for (const name of names) {
    const link = document.createElement('a');
    link.href = worldUrl(name);
    link.target = '_blank';
    link.rel = 'noopener';
    link.textContent = name;
    link.dataset.name = name;
    container.appendChild(link);
  }
}

// colors the list entries of the favorite worlds, highlights the entry of the named world and scrolls it into view
function markLinks(id, name) {
  for (const link of document.getElementById(id).children) {
    const isFavorite = favorites.has(link.dataset.name);
    if (link.classList.contains('favorite') !== isFavorite) link.classList.toggle('favorite', isFavorite);
    const selected = link.dataset.name === name;
    if (link.classList.contains('selected') === selected) continue;
    link.classList.toggle('selected', selected);
    if (selected) link.scrollIntoView({ block: 'nearest' });
  }
}

// The list on the left shows the worlds of the selected tab. A click on an entry selects that world.
document.getElementById('upList').addEventListener('click', (event) => {
  const link = event.target.closest('a');
  if (!link) return;
  // a plain click loads the world in the iframe; Ctrl, Shift or Meta with a click lets the browser open the link
  if (event.ctrlKey || event.shiftKey || event.metaKey) return;
  event.preventDefault();
  const index = NAMES.indexOf(link.dataset.name);
  if (index < 0) throw new Error('no world named ' + link.dataset.name + ' in tab ' + tab);
  current = index;
  render();
});

// the worlds of a tab: the Favorites tab holds the favorite worlds, so it changes with every favorite and unfavorite
function tabNames(name) {
  if (name === FAVORITES) return TABS.all.filter((world) => favorites.has(world));  if (!TABS[name]) throw new Error('no tab named ' + name);
  return TABS[name];
}

function render() {
  NAMES = tabNames(tab);
  for (const tabName of TAB_ORDER) setText('count-' + tabName, String(tabNames(tabName).length));
  const empty = NAMES.length === 0;
  if (!empty) current = Math.min(current, NAMES.length - 1);
  const name = empty ? '' : NAMES[current];
  const isFavorite = favorites.has(name);
  const frame = document.getElementById('frame');
  const pic = document.getElementById('pic');
  frame.hidden = showThumb;
  pic.hidden = !showThumb;
  const frameUrl = showThumb || empty ? BLANK_PAGE : frameWorldUrl(name);
  if (frame.dataset.url !== frameUrl) {
    frame.dataset.url = frameUrl;
    frame.src = frameUrl;
    interactAvailable = false;
    clearTimeout(interactAvailableTimer);
    if (frameUrl !== BLANK_PAGE) interactAvailableTimer = setTimeout(() => { interactAvailable = true; render(); }, INTERACT_DELAY_SECONDS * 1000);
  }
  // the legend shows the i key and the world's keys only while the i key is available
  document.getElementById('keyInteract').hidden = !interactAvailable;
  document.getElementById('worldKeys').hidden = !interactAvailable;
  // the site hosts each world's thumbnail, so this page needs no file beside it
  const source = showThumb && !empty ? SITE + '/thumbs/' + encodeURIComponent(name) + '.jpg' : '';
  if ((pic.getAttribute('src') || '') !== source) { if (source) pic.src = source; else pic.removeAttribute('src'); }
  if (pic.alt !== name) pic.alt = name;
  for (const button of document.querySelectorAll('#tabs button')) button.setAttribute('aria-selected', String(button.dataset.tab === tab));
  document.getElementById('view').className = isFavorite ? 'favorite' : '';
  setText('pos', empty ? '0 / 0' : (current + 1) + ' / ' + NAMES.length);
  setText('name', empty ? EMPTY_TAB_NOTICE : name);
  // the legend shows an arrow only while it can do something, with what it does
  const addAction = arrowAction(true);
  const removeAction = arrowAction(false);
  document.getElementById('keyAdd').hidden = addAction === NONE;
  document.getElementById('keyRemove').hidden = removeAction === NONE;
  setText('keyAddText', ARROW_TEXTS.add[addAction] + undoCountText(addAction, true));
  setText('keyRemoveText', ARROW_TEXTS.remove[removeAction] + undoCountText(removeAction, false));
  setText('mode', interact ? INTERACT_NOTICE : '');
  // the Clear and Default buttons belong to the Favorites list, and each shows only while it would change the favorites
  document.getElementById('clear').hidden = tab !== FAVORITES || empty;
  document.getElementById('defaults').hidden = tab !== FAVORITES || favoritesHash() === DEFAULT_HASH;
  setLinks('upList', NAMES);
  setText('listName', TAB_LABELS[tab]);
  setText('upCount', String(NAMES.length));
  markLinks('upList', name);
}

// What the left arrow (makesFavorite true) or the right arrow (makesFavorite false) does now. The left arrow adds a selected
// world that is not a favorite; on a favorite, or in an empty list, it undoes the last removal. The right arrow removes
// a selected favorite; on a world that is not a favorite, or in an empty list, it undoes the last add.
function arrowAction(makesFavorite) {
  if (NAMES.length > 0 && favorites.has(NAMES[current]) !== makesFavorite) return SET;
  return undoableWorlds(makesFavorite).length === 0 ? NONE : UNDO;
}

// The changes that the left arrow (makesFavorite true) or the right arrow can still undo; the last entry is the next to
// undo. The function first drops the latest entries that a later change already reversed: a removed world that is a
// favorite again, or an added world that is no longer a favorite.
function undoableWorlds(makesFavorite) {
  const worlds = makesFavorite ? removedWorlds : addedWorlds;
  while (worlds.length > 0 && favorites.has(worlds[worlds.length - 1]) === makesFavorite) worlds.pop();
  return worlds;
}

// the legend's count of the changes that an arrow can still undo, such as " (3 left)"; '' when the arrow does not undo
function undoCountText(action, makesFavorite) {
  return action === UNDO ? ' (' + undoableWorlds(makesFavorite).length + ' left)' : '';
}

// reverses the latest change of the opposite arrow and selects the world that it changed, when the selected list holds it
function undoFavorite(makesFavorite) {
  const name = undoableWorlds(makesFavorite).pop();
  if (makesFavorite) favorites.add(name); else favorites.delete(name);
  save();
  const index = tabNames(tab).indexOf(name);
  if (index >= 0) current = index;
}

function forgetLastChanges() {
  addedWorlds = [];
  removedWorlds = [];
}

function showTab(name) {
  positions[tab] = current;
  tab = name;
  current = positions[tab];
  render();
}

document.getElementById('tabs').addEventListener('click', (event) => {
  const button = event.target.closest('button');
  if (!button) return;
  button.blur();
  showTab(button.dataset.tab);
});

// The Clear button makes every favorite an ordinary world again.
document.getElementById('clear').addEventListener('click', (event) => {
  event.currentTarget.blur();
  if (!confirm('Remove all ' + favorites.size + ' favorites?')) return;
  favorites.clear();
  forgetLastChanges();
  save();
  render();
});

// The add box: the user types a world name, a part of one, or a world number, and Enter makes that world a favorite.
// The a key puts the keyboard focus in the box, and Escape leaves it. The box suggests the world names as the user types.
const addInput = document.getElementById('addInput');
for (const name of TABS.all) {
  const option = document.createElement('option');
  option.value = name;
  document.getElementById('worldNames').appendChild(option);
}
// the number of matching world names that a message lists
const LISTED_MATCH_COUNT = 5;

// The world that the typed text names: its name, or a message that says why the text names no single world.
// One of the two properties is ''.
function findWorld(text) {
  const query = text.trim().toLowerCase().replace(/\s+/g, '-');
  if (query === '') return { name: '', message: 'Type a world name or a world number.' };
  if (/^\d+$/.test(query)) {
    const position = Number(query);
    if (position >= 1 && position <= TABS.all.length) return { name: TABS.all[position - 1], message: '' };
    return { name: '', message: 'A world number is from 1 to ' + TABS.all.length + '.' };
  }
  if (TABS.all.includes(query)) return { name: query, message: '' };
  const matches = TABS.all.filter((name) => name.includes(query));
  if (matches.length === 1) return { name: matches[0], message: '' };
  if (matches.length === 0) return { name: '', message: 'No world name contains "' + query + '".' };
  const more = matches.length > LISTED_MATCH_COUNT ? ', and ' + (matches.length - LISTED_MATCH_COUNT) + ' more' : '';
  return { name: '', message: matches.length + ' world names contain "' + query + '": ' + matches.slice(0, LISTED_MATCH_COUNT).join(', ') + more + '.' };
}

addInput.addEventListener('keydown', (event) => {
  // the keys typed in the box are text, so the page's own keys do not act on them
  event.stopPropagation();
  if (event.key === 'Escape') {
    addInput.value = '';
    setText('addMessage', '');
    addInput.blur();
    return;
  }
  if (event.key !== 'Enter') return;
  const found = findWorld(addInput.value);
  setText('addMessage', found.message);
  if (found.name === '') return;
  if (!favorites.has(found.name)) {
    favorites.add(found.name);
    addedWorlds.push(found.name);
    save();
  }
  addInput.value = '';
  addInput.blur();
  // show the world in the Favorites list
  positions[tab] = current;
  tab = FAVORITES;
  current = tabNames(FAVORITES).indexOf(found.name);
  render();
});

// The Default button replaces the favorites with the default favorites.
document.getElementById('defaults').addEventListener('click', (event) => {
  event.currentTarget.blur();
  const defaults = parseFavorites(DEFAULT_HASH);
  if (!confirm('Replace the ' + favorites.size + ' favorites with the ' + defaults.size + ' default favorites?')) return;
  favorites = defaults;
  forgetLastChanges();
  save();
  render();
});

// The URL that the iframe loads: the site's start page with the world named in start, and ante=0, which makes the site
// open in the world without its antechamber (src/main.js). The /w/NAME/ page of worldUrl redirects to the start page
// and drops added parameters, so the iframe does not use it.
function frameWorldUrl(name) {
  return SITE + '/?start=' + encodeURIComponent(name) + '&ante=0';
}

function worldUrl(name) {
  return SITE + '/w/' + encodeURIComponent(name) + '/';
}

// makes the selected world a favorite or not, and moves on: forward when the world stays in this tab; when it leaves (a favorite unfavorited in the Favorites tab), the next world takes its place
function setFavorite(isFavorite) {
  const name = NAMES[current];
  if (isFavorite) { favorites.add(name); addedWorlds.push(name); } else { favorites.delete(name); removedWorlds.push(name); }
  save();
  const remaining = tabNames(tab);
  if (remaining.length === 0) current = 0;
  else current = (remaining.includes(name) ? current + 1 : current) % remaining.length;
}

document.addEventListener('keydown', (event) => {
  if (event.ctrlKey || event.altKey || event.metaKey) return;
  const key = event.key.toLowerCase();
  if (key === 'tab') {
    event.preventDefault();
    const step = event.shiftKey ? TAB_ORDER.length - 1 : 1;
    showTab(TAB_ORDER[(TAB_ORDER.indexOf(tab) + step) % TAB_ORDER.length]);
    return;
  }
  if (key === 'a') {
    // preventDefault keeps the letter a out of the add box
    event.preventDefault();
    addInput.focus();
    return;
  }
  if (key === 'p') showThumb = !showThumb;
  else if (key === 'i') {
    if (!interactAvailable) return;
    interact = true;
    render();
    document.getElementById('frame').focus();
    clearTimeout(interactTimer);
    interactTimer = setTimeout(endInteract, INTERACT_SECONDS * 1000);
    return;
  }
  else if (key === 'arrowleft' || key === 'arrowright') {
    event.preventDefault();
    const makesFavorite = key === 'arrowleft';
    const action = arrowAction(makesFavorite);
    if (action === NONE) return;
    if (action === SET) setFavorite(makesFavorite); else undoFavorite(makesFavorite);
  }
  else if (NAMES.length === 0) return;
  else if (key === 'arrowup' || key === 'arrowdown') {
    event.preventDefault();
    current = (current + (key === 'arrowdown' ? 1 : NAMES.length - 1)) % NAMES.length;
  }
  else return;
  render();
});

// A click inside the iframe moves the keyboard focus to the world's page, which is on another origin,
// so this page stops receiving keys. Unless the user asked for that with the i key, take the focus back.
window.addEventListener('blur', () => {
  if (interact) return;
  setTimeout(() => {
    const frame = document.getElementById('frame');
    if (document.activeElement !== frame) return;
    frame.blur();
    window.focus();
  }, 0);
});

// ends the i key's period: this page takes the keyboard focus back from the world
function endInteract() {
  clearTimeout(interactTimer);
  interact = false;
  const frame = document.getElementById('frame');
  if (document.activeElement === frame) {
    frame.blur();
    window.focus();
  }
  render();
}

// a click on this page, outside the iframe, ends the i key's period early
document.addEventListener('mousedown', () => {
  if (interact) endInteract();
});

setText('interactSeconds', String(INTERACT_SECONDS));

render();
</script>
</body>
</html>
